<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GOV.UK Prototype Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <b>GOV.UK Prototype Builder</b>
  </header>

  <div class="app">
    <!-- Left: component palette -->
    <div class="col" id="pal" aria-label="Components"></div>

    <!-- Middle: page buttons and canvas -->
    <div>
      <div class="pbar" id="bar"></div>
      <div class="col" id="cv">
        <div class="page">
          <div class="in" id="page"></div>
        </div>
      </div>
      <div class="col" id="flow" hidden></div>
    </div>

    <!-- Right: properties and generated code -->
    <div class="col" id="side">
      <div class="tabs" role="tablist">
        <button class="tab" data-t="p">Properties</button>
        <button class="tab" data-t="n">Nunjucks</button>
        <button class="tab" data-t="h">HTML</button>
        <button class="tab" data-t="r">Routes</button>
        <button class="tab" data-t="x">Export</button>
      </div>
      <div id="sb"></div>
    </div>
  </div>

  <script src="flow.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
